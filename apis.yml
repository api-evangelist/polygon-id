    url: https://github.com/0xPolygonID
- name: Polygon ID Wallet SDK (Flutter)
  description: >
    Flutter plugin for integrating Polygon ID wallet capabilities into mobile applications. Provides identity
    creation, credential storage, ZK proof generation, and protocol communication for both Android and
    iOS.

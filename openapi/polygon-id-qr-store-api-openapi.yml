openapi: 3.2.0
info:
  title: Privado ID - Issuer QR Store API
  description: 'The Issuer Node Core API is ideal for users who need multiple identities and for integrator profiles, who want to

    create solutions based on Privado ID functionalities and might be interested in having access to low level

    information such as Merkle Trees.'
  version: '1'
tags:
- name: QR Store
paths:
  /v2/qr-store:
    get:
      summary: Get QrCode from store
      operationId: GetQrFromStore
      description: Returns a previously generated QR code via url shortener method
      tags:
      - QR Store
      parameters:
      - in: query
        name: id
        schema:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import:
            name: uuid
            path: github.com/google/uuid
          example: 8edd8112-c415-11ed-b036-debe37e1cbd6
      - in: query
        name: issuer
        schema:
          type: string
      responses:
        '200':
          description: A json to generate a QR code
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/400'
        '410':
          $ref: '#/components/responses/410'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
components:
  responses:
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorMessage'
    '410':
      description: Gone
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorMessage'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorMessage'
    '500':
      description: Internal Server  error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorMessage'
  schemas:
    GenericErrorMessage:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          example: Something happen
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
